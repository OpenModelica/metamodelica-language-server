name: Build

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup npm
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/

      - name: Install X server
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: "Setup OpenModelica Compiler"
        uses: OpenModelica/setup-openmodelica@419f31141aa79a22f7033def5626047dd3bb5069 # v1.2.0
        with:
          version: "stable"
          packages: |
            omc
      - run: omc --version

      - name: Setup gdb
        run: |
          sudo apt-get update
          sudo apt-get install -y gdb

      - name: gdb version
        run: gdb --version

      - name: Install the dependencies
        run: npm clean-install && npm run postinstall

      - name: Lint
        run: npm run lint

      - name: Build package
        run: npm run esbuild

      - name: Tests
        run: |
          Xvfb -ac :99 -screen 0 1280x1024x16 &
          export DISPLAY=:99
          npm run test

      - name: Package Extension
        run: npx vsce package

      - name: Archive vsix package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: metamodelica-language-server.vsix
          path: metamodelica-language-server-*.vsix

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: metamodelica-language-server.vsix

      - name: Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            metamodelica-language-server-*.vsix
          fail_on_unmatched_files: true
          generate_release_notes: true
          append_body: true

      - name: Publish to Visual Studio Marketplace
        if: always()
        run: |
          npx vsce publish -i $(ls metamodelica-language-server-*.vsix) -p ${{ secrets.VSCE_PAT }}

      - name: Publish to Open VSX
        if: always()
        run: |
          npx ovsx publish $(ls metamodelica-language-server-*.vsix) -p ${{ secrets.OPEN_VSX_TOKEN }}
