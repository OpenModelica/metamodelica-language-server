name: Build

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup npm
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/

      - name: Install X server
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: "Setup OpenModelica Compiler"
        uses: OpenModelica/setup-openmodelica@dd6dc5fdb91c936dd3ab328902808c8a5421f146 # v1.1.0
        with:
          version: "stable"
          packages: |
            omc
      - run: omc --version

      - name: Setup gdb
        run: |
          sudo apt-get update
          sudo apt-get install -y gdb

      - name: gdb version
        run: gdb --version

      - name: Install the dependencies
        run: npm clean-install && npm run postinstall

      - name: Build package
        run: npm run esbuild

      - name: Tests
        run: |
          Xvfb -ac :99 -screen 0 1280x1024x16 &
          export DISPLAY=:99
          npm run test

      - name: Package Extension
        run: npx vsce package

      - name: Archive vsix package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: metamodelica-language-server.vsix
          path: metamodelica-language-server-*.vsix

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: metamodelica-language-server.vsix

      - name: Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            metamodelica-language-server-*.vsix
          fail_on_unmatched_files: true
          generate_release_notes: true
          append_body: true

      - name: Publish to Visual Studio Marketplace
        if: always()
        run: |
          npx vsce publish -i $(ls metamodelica-language-server-*.vsix) -p ${{ secrets.VSCE_PAT }}

      - name: Publish to Open VSX
        if: always()
        run: |
          npx ovsx publish $(ls metamodelica-language-server-*.vsix) -p ${{ secrets.OPEN_VSX_TOKEN }}
